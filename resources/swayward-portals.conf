# Portal backend selection for swayward sessions.
# GTK provides the general desktop portals. swayward implements the Mutter
# interfaces used by xdg-desktop-portal-gnome for integrated screen capture.
[preferred]
default=gtk;
org.freedesktop.impl.portal.ScreenCast=gnome;
org.freedesktop.impl.portal.Screenshot=gnome;
org.freedesktop.impl.portal.RemoteDesktop=none;
org.freedesktop.impl.portal.Secret=gnome-keyring;

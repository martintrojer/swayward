# Portal backend selection for swayward sessions.
#
# Mirrors sway's own shipped policy (/usr/share/xdg-desktop-portal/
# sway-portals.conf), because swayward presents itself as a sway-compatible
# compositor and the same backends apply. Deviating here would give a migrating
# user a different portal experience than the compositor they came from.
[preferred]
# Use xdg-desktop-portal-gtk for every portal interface...
default=gtk
# ... except ScreenCast and Screenshot, which need a wlroots backend. Without
# these two lines screen sharing and screenshot portals find no backend at all
# and fail silently.
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
# xdg-desktop-portal-gtk's Inhibit implementation is broken outside GNOME.
# https://github.com/flatpak/xdg-desktop-portal-gtk/issues/465
org.freedesktop.impl.portal.Inhibit=none

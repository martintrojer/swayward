name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DEPS_APT: curl gcc clang libudev-dev libgbm-dev libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev libpango1.0-dev libdisplay-info-dev perl libtest-simple-perl libjson-pp-perl libxcb-xkb-dev x11-xkb-utils
  DEPS_DNF: cargo gcc clang libudev-devel libgbm-devel libxkbcommon-devel wayland-devel libinput-devel dbus-devel systemd-devel libseat-devel pipewire-devel pango-devel cairo-gobject-devel libdisplay-info-devel perl-JSON-PP perl-Test-Simple

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./contrib/fetch-oracle
      - run: cargo test --all -- --nocapture

  build:
    name: check feature combinations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features dbus
      - run: cargo check --no-default-features --features systemd
      - run: cargo check --no-default-features --features dinit
      - run: cargo check --no-default-features --features xdp-gnome-screencast
      - run: cargo check
      - run: cargo check -p swayward-ipc --features json-schema
      - run: cargo build --features profile-with-tracy

  randomized-tests:
    name: randomized and slow tests
    runs-on: ubuntu-24.04
    env:
      RUST_BACKTRACE: 1
      RUN_SLOW_TESTS: 1
      PROPTEST_CASES: 200000
      PROPTEST_MAX_LOCAL_REJECTS: 200000
      PROPTEST_MAX_GLOBAL_REJECTS: 200000
      PROPTEST_MAX_SHRINK_ITERS: 200000
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./contrib/fetch-oracle
      - run: cargo test --no-run --all --exclude swayward-visual-tests --release
      - run: cargo test --all --exclude swayward-visual-tests --release

  visual-tests:
    name: visual tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --package swayward-visual-tests

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ${{ env.DEPS_APT }} libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all --all-targets -- -D warnings

  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  internal-links:
    name: public docs do not link to docs/internal
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
          # check-divergence diffs against the recorded niri base commit.
          fetch-depth: 0
      - run: sudo apt-get update -y && sudo apt-get install -y ripgrep shellcheck
      - run: shellcheck -S warning contrib/*.sh resources/swayward-session tests/i3/sway-calibration/*.sh
      - run: ./contrib/test-dev-run.sh
      - run: ./contrib/test-install-session.sh
      - run: ./contrib/test-session-environment.sh
      - run: ./contrib/check-internal-links
      - run: ./contrib/check-divergence
      - run: ./contrib/fetch-oracle
      - run: ./contrib/command-census --check
      - run: ./contrib/coverage-report --unvendored
      - run: ./contrib/coverage-report --check
      - name: Check sway fixture schema
        run: |
          git clone --branch 1.12 --depth 1 https://github.com/swaywm/sway.git /tmp/sway
          ./contrib/check-sway-fixture-schema /tmp/sway

  release-consistency:
    name: release metadata agrees
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - run: ./contrib/test-release-consistency

  sway-to-kdl:
    name: sway config translator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - run: python3 contrib/test-sway-to-kdl.py

  wiki-links:
    name: wiki links resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - run: python3 contrib/test-sync-github-wiki.py
      - run: ./contrib/sync-github-wiki --check

  fedora:
    name: fedora ${{ matrix.fedora }} build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Same pair release.yml ships RPMs for. Gating on both means a rename
        # or drop in DEPS_DNF fails a pull request rather than a release run.
        fedora: [43, 44]
    container: fedora:${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false
      - name: Install dependencies
        run: |
          sudo dnf update -y
          sudo dnf install -y ${{ env.DEPS_DNF }} libadwaita-devel
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all

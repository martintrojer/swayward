name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public version, without the leading v'
        required: true

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  prepare-release:
    # Build on the oldest runner we support, not the newest. glibc is forward
    # compatible only, so the build machine's glibc becomes the floor for
    # every user: building on ubuntu-24.04 would require glibc 2.39 and lock
    # out Ubuntu 22.04 and Debian 12.
    #
    # 22.04 is viable because the one version-sensitive dependency, pipewire,
    # asks for feature v0_3_33 and 22.04 ships libpipewire 0.3.48. If a future
    # dependency needs newer system headers, raise this and say so here.
    runs-on: ubuntu-22.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Check for unreplaced "Since:" in the wiki
        run: |
          # Fail if a match is found (exit code 0)
          grep --recursive 'Since: next release' docs/wiki && exit 1

          # Fail if grep failed (exit code 2)
          status=$?
          if [ $status -ne 1 ]; then exit $status; fi

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y curl gcc clang libudev-dev libgbm-dev \
            libxkbcommon-dev libegl1-mesa-dev libwayland-dev libinput-dev \
            libdbus-1-dev libsystemd-dev libseat-dev libpipewire-0.3-dev \
            libpango1.0-dev libdisplay-info-dev \
            perl libjson-pp-perl libtest-simple-perl libxcb-xkb-dev x11-xkb-utils

      - uses: dtolnay/rust-toolchain@stable

      - name: Create vendored dependencies archive
        run: |
          mkdir .cargo
          cargo vendor --locked > .cargo/config.toml
          tar cJf swayward-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz vendor .cargo

      - name: Build
        run: cargo build --all --frozen --release

      - name: Test
        run: cargo test --all --frozen --release -- --nocapture

      - name: Stage the binary tarball
        run: |
          set -eux
          version=${{ github.event.inputs.version }}
          stage=swayward-$version-x86_64-linux-gnu
          mkdir -p "$stage"/{bin,share}

          install -Dm755 target/release/swayward "$stage/bin/swayward"
          install -Dm755 target/release/swaywardmsg "$stage/bin/swaywardmsg"
          install -Dm755 resources/swayward-session "$stage/bin/swayward-session"

          install -Dm644 resources/swayward.desktop "$stage/share/swayward.desktop"
          install -Dm644 resources/swayward-portals.conf "$stage/share/swayward-portals.conf"
          install -Dm644 resources/swayward.service "$stage/share/swayward.service"
          install -Dm644 resources/swayward-shutdown.target "$stage/share/swayward-shutdown.target"
          install -Dm644 resources/default-config.kdl "$stage/share/default-config.kdl"
          install -Dm644 LICENSE "$stage/LICENSE"

          # Record what the binary actually needs, measured rather than
          # guessed, so an installer can check before unpacking.
          {
            echo "swayward $version, x86_64, dynamically linked against the system graphics stack."
            echo
            echo "Minimum glibc: $(objdump -T target/release/swayward |
              grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)"
            echo
            echo "This build is not self-contained. A compositor cannot statically link"
            echo "the seat, input and GPU stack it drives. Install the runtime libraries"
            echo "your distribution ships for a wlroots-style compositor, plus:"
            echo "  xdg-desktop-portal-gtk  xdg-desktop-portal-wlr  xwayland-satellite"
            echo
            echo "See INSTALL.md in this archive."
          } > "$stage/RUNTIME.txt"
          cp docs/BUILDING.md "$stage/INSTALL.md"

          tar czf "$stage.tar.gz" "$stage"
          sha256sum "$stage.tar.gz" > "$stage.tar.gz.sha256"

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ github.event.inputs.version }}
          files: |
            swayward-${{ github.event.inputs.version }}-vendored-dependencies.tar.xz
            swayward-${{ github.event.inputs.version }}-x86_64-linux-gnu.tar.gz
            swayward-${{ github.event.inputs.version }}-x86_64-linux-gnu.tar.gz.sha256
          fail_on_unmatched_files: true

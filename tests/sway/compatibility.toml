# Source data for the compatibility counts in docs/SWAY_COMPATIBILITY.md.
# contrib/command-census checks these entries against the document tables and
# derives every request, event-family, and runtime-command census count. The
# fixture scenario list matches the cases loaded by live_ipc_descriptions_
# match_sway_schema_and_values; other tree fixtures support separate tests.
# Keep this aligned with tests/fixtures/sway/schema-version.json.
sway_version = "1.12"
sway_commit = "88869399f421d9180dd8b6ed0b5a1f4a3585d252"
previous_probe_total = 81
get_inputs_fields = [
    "identifier",
    "name",
    "vendor",
    "product",
    "type",
    "libinput",
    "repeat_delay",
    "repeat_rate",
    "xkb_layout_names",
    "xkb_active_layout_index",
    "xkb_active_layout_name",
    "scroll_factor",
]
get_version_fields = [
    "human_readable",
    "variant",
    "major",
    "minor",
    "patch",
    "loaded_config_file_name",
]

[fixtures]
tree_scenarios = [
    "empty",
    "empty_named",
    "fullscreen",
    "marked",
    "named_workspace",
    "nested_h_in_v",
    "numbered_sparse",
    "one_floating",
    "one_window",
    "stacked",
    "tabbed",
    "two_split_h",
    "two_split_v",
    "two_workspaces",
]


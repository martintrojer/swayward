[files."283-net-wm-state-hidden.t"]
category = "unreachable"
reason = "Every assertion reads `_NET_WM_STATE_HIDDEN` from X windows. xdg-toplevel's optional `suspended` configure state is not this asserted X property and sway's XWM owns the atom path."

[files."288-i3-floating-window-atom.t"]

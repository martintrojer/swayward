[files."259-net-wm-user-time.t"]
category = "unreachable"
reason = "Sets `_NET_WM_USER_TIME` before map and tests X focus prevention. Native xdg-shell has no user-time property; sway receives this metadata through its Xwayland view (`sway/sway/desktop/xwayland.c:816-869`)."

[files."278-layout-restore-output.t"]

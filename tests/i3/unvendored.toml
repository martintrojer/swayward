# Files from i3 that swayward does not vendor.
#
# GENERATED-CHECKABLE: the list must equal the set difference between i3's
# testcases/t and tests/i3/t at the pinned commit. contrib/coverage-report
# --unvendored verifies that, so this file cannot drift the way the prose
# audit it replaced did.
#
# category:
#   unreachable  the premise cannot exist here (X11 protocol, in-place
#                restart, i3 binaries), so vendoring it would add a file
#                that can never pass
#   i3_only      an i3 subsystem sway does not have
#   deferred     reachable, but blocked on work we have not done

[files."000-load-deps.t"]
category = "i3_only"
reason = "Loads the Perl and XCB dependencies of i3's own test runner; it does not query a compositor (`i3/testcases/t/000-load-deps.t:5-19`)."

[files."002-i3-sync.t"]
category = "i3_only"
reason = "Asserts i3's private `I3_SYNC` X ClientMessage handshake (`i3/testcases/lib/i3test.pm.in:728-787`; `i3/src/handlers.c:813-815`). The local helper is only a harness barrier, not that protocol."

[files."004-unmanaged.t"]
category = "unreachable"
reason = "Requires an X11 override-redirect window and compares its pre-map and post-map X rectangles. Native `xdg_toplevel` has neither override-redirect state nor a client-selected absolute rectangle; see the X11 boundary above."

[files."114-client-leader.t"]
category = "unreachable"
reason = "Uses `WM_CLIENT_LEADER`, `WM_TRANSIENT_FOR`, X input focus, and `window_properties.transient_for`. Native xdg-shell can express only the parent relation, not the leader or X IPC fields (`sway/sway/desktop/xdg_shell.c:228-235`; `sway/sway/ipc-json.c:670-700`)."

[files."158-wm_take_focus.t"]
category = "unreachable"
reason = "Receives and distinguishes the ICCCM `WM_TAKE_FOCUS` ClientMessage and reads `_NET_WM_STATE_FOCUSED`; both require the in-process XWM and an addressable X window (`sway/sway/desktop/xwayland.c:816-869`)."

[files."163-wm-state.t"]
category = "unreachable"
reason = "Reads ICCCM `WM_STATE_NORMAL` and `WM_STATE_WITHDRAWN` from an X window. No corresponding property exists on native xdg-shell surfaces; see the X11 boundary above."

[files."171-config-migrate.t"]
category = "i3_only"
reason = "Executes `i3-migrate-config-to-v4 --v3` and checks its private v3 rewrite rules. Sway has no such utility in its command surface (`sway/sway/commands.c:44-144`)."

[files."175-startup-notification.t"]
category = "unreachable"
reason = "The first placement scenario has a Wayland analogue: an activation token used before map assigns the view to the launch workspace (`sway/sway/xdg_activation_v1.c:20-41`), and `exec` creates tokens unless `--no-startup-id` is set (`sway/sway/commands/exec_always.c:28-67`). Later assertions instead propagate `_NET_STARTUP_ID` through `WM_CLIENT_LEADER`; xdg activation tokens have no leader-property inheritance. The complete unchanged file therefore cannot become green without fabricating X11 metadata."

[files."195-net-active-window.t"]
category = "unreachable"
reason = "Drives `_NET_ACTIVE_WINDOW`, reads the root property, and addresses X dock and scratchpad windows by XID. xdg-activation can substitute only the activation request, not the root property or X identities (`sway/sway/xdg_activation_v1.c:8-49`)."

[files."207-shmlog.t"]
category = "i3_only"
reason = "Executes `i3-dump-log` and the i3-only `shmlog` command. Sway's complete command tables contain neither (`sway/sway/commands.c:44-144`)."

[files."209-ewmh-net-workarea.t"]
category = "unreachable"
reason = "Creates, reads, and expects deletion of `_NET_WORKAREA` on the X root window. The satellite boundary does not expose the X root to the compositor; see the X11 boundary above."

[files."214-layout-restore-criteria.t"]
category = "i3_only"
reason = "Every behavior under test starts with `append_layout` and inspects JSON swallow placeholders. Sway has no layout-restoration command; see the layout-restoration boundary above."

[files."215-layout-restore-crash.t"]
category = "i3_only"
reason = "Exercises malformed and partial `append_layout` JSON plus placeholder liveness. Sway has no `append_layout`; see the layout-restoration boundary above."

[files."216-layout-restore-split-swallows.t"]
category = "i3_only"
reason = "Asserts `append_layout`'s private JSON `swallows` representation. Sway has no `append_layout`; see the layout-restoration boundary above."

[files."217-NET_CURRENT_DESKTOP.t"]
category = "unreachable"
reason = "Reads and sends `_NET_CURRENT_DESKTOP` on the X root window. Workspace IPC is portable, but it cannot prove this EWMH property or ClientMessage path; see the X11 boundary above."

[files."223-net-client-list.t"]
category = "unreachable"
reason = "Every assertion reads `_NET_CLIENT_LIST`, an array of X window IDs on the X root, including dock exclusion. Neither the property nor those XIDs cross the satellite boundary."

[files."229-cleanup-tmpdir.t"]
category = "i3_only"
reason = "Inspects i3's private temporary directory and config-path X atom across exit and in-place restart. The in-process harness exposes neither process lifecycle; see the lifecycle boundary above."

[files."230-floating-fullscreen-restart.t"]
category = "i3_only"
reason = "All postcondition assertions depend on preserving a floating X window across compositor restart. The harness cannot restart while retaining clients, and sway has no runtime restart command; see the lifecycle boundary above."

[files."234-ewmh-desktop-names.t"]
category = "unreachable"
reason = "Reads `_NET_DESKTOP_NAMES` from the X root. `GET_WORKSPACES` can test workspace names, but substituting it would not test this EWMH publication path."

[files."239-net-close-window-request.t"]
category = "unreachable"
reason = "Sends `_NET_CLOSE_WINDOW` to the X root. `xdg_toplevel.close` runs in the opposite direction, compositor to client, so no native client request can substitute for this EWMH message (`sway/sway/desktop/xdg_shell.c:252-256`)."

[files."249-layout-restore-floating.t"]

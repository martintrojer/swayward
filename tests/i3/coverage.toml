note = "Fresh measurement reaches `1..1`, but the liveness pass is vacuous: the native window cannot set `_NET_WM_WINDOW_TYPE_DOCK`, so the resize criterion addresses an ordinary view instead of a dock. Native resize/reconfigure behavior is covered by `layer_surface_size_and_exclusive_zone_reconfigure_without_moving_outputs`, which changes a real layer-shell surface's size and exclusive zone. Sway rearranges layers on every committed layer-state change (`sway/sway/desktop/layer_shell.c:259-277`)."


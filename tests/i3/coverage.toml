note = "FULLY GREEN at 9 of 9, after the schema split this row previously named as the prerequisite. Five separate defects, each cited. (1) The translator collapsed a single-output `workspace <name> output <output>` to niri's `open-on-output`, which means a PRE-CREATED workspace, so every assigned workspace was materialised on the first output at startup. It now always emits `sway-output-assignment`, which is an assignment only. (2) Startup name precedence was inverted: workspace_next_name takes 'assignments primarily, falling back to bindings and numbers' (sway/sway/tree/workspace.c:440), since both loops run and the assignment loop overwrites the binding's choice. (3) A binding name is gated by workspace_valid_on_output (:334-354), which requires a name that HAS an assignment to match that assignment's first resolvable output. (4) initialize_workspaces_from_bindings never loaded workspace_configs, so the assignment list was EMPTY while startup names were resolved and every output fell through to a binding name or a bare number; it also skipped an output with no claimable name instead of falling back to the next free number (:484-490). (5) The numeric fallback handed out a number reserved by another output's assignment; it now skips those, but only where the assignment actually RESOLVES, since an assignment naming solely absent outputs claims nothing and its number stays free. One harness bug was also fixed: get_output_for_workspace returned undef for a missing workspace where i3's helper returns the empty string, which this file compares against, so four assertions reported a false failure for workspaces that correctly did not exist. Every assertion the file REACHES now passes: 9 of 9, up from 2. The file declares no TAP plan and exits 29 after those 9, because its later sections configure multi-output assignment lists such as `workspace 1 output fake-1 fake-2`, which the fake-outputs adapter does not yet build, so plan_unknown stays set and the file is not counted green."


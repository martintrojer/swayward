# i3 conformance coverage. THE SOURCE OF TRUTH.
#
# tests/i3/README.md is GENERATED from this file. Edit here, never there.
#
# THE TARGET STATE: every assertion either passes, or is a documented skip.
# Nothing else is an acceptable end state.
#
#   pass        a count. A passing assertion needs no documentation.
#   skip        ITEMISED, one table per assertion, each with a reason and a
#               citation. This is the permanent, finished state for anything
#               that cannot pass. A skip says "we asked, and the expectation
#               is not sway behaviour" -- so it must prove that with a source
#               reference, or it is just a fail wearing a better label.
#   fail        a count. TEMPORARY. We asked and got the wrong answer.
#   unreached   a count. TEMPORARY. The harness never got to ask.
#
# fail and unreached are the WORK QUEUE. The job is to turn each one into
# either a pass or a documented skip. They are plain numbers on purpose: no
# detail is owed for work that is meant to disappear. Every skip, by contrast,
# is permanent and must carry its evidence.

# WORKED EXAMPLE -- 319-gaps.t is the first file taken to the standard, and
# shows what "documented" means in practice.
#
#   Its two skips are itemised with a reason and a source citation. The reason
#   was read out of the real TAP output, and the citation was verified by
#   opening sway/sway/tree/workspace.c:224-240, which copies gaps once at
#   workspace_create and never revisits an existing workspace. That is why i3's
#   reload expectation cannot hold, and the citation is what makes the skip a
#   finding rather than an excuse.
#
#   Its one remaining failure is labelled an open defect, in those words. It is
#   a real geometry bug, not a divergence, and calling it anything softer would
#   hide it.
#
# Driving this file from 3 violations to 0 moved the project total 168 -> 165.
# That is the unit of work.

[families]
bar_protocol = "swayward has no i3bar. This is a deliberate, documented deviation."
compositor_restart = "The file restarts the compositor in place. The harness cannot restart a running swayward and keep its Wayland clients."
i3_floating_wrapper = "i3 wraps every floating window in a CT_FLOATING_CON container. Sway serialises the floating leaf directly, so the assertion's tree path does not exist."
i3_only_semantics = "The expectation is i3 behaviour that sway deliberately does not share."
i3_output_content = "i3 places a `content` container under each output. Sway places workspaces directly below outputs (sway/sway/ipc-json.c:869-874)."
i3_parser_internals = "The file tests i3's own config parser implementation, which swayward does not share."
obsolete_mode_toggle = "The file uses i3's obsolete `mode toggle` to float a window. Neither the pinned i3 nor sway reads that as a floating command (sway/sway/commands/mode.c:23-45)."
workspace_model = "Blocked on the workspace identity and ordering model, specified in docs/specs/2026-09-16-workspace-order-model.md."
x11_absolute_geometry = "i3 sets an absolute initial rectangle through X11. xdg_toplevel has no equivalent request, so the window is never at the size or position the assertion assumes."
x11_dock = "The file uses X11 dock windows. swayward's equivalent is wlr-layer-shell, covered natively instead."
x11_ewmh = "The assertion depends on EWMH/ICCCM X11 properties that a native Wayland client cannot set."


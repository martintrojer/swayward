[files."256-no-auto-back-and-forth.t"]
assertions = 10
pass = 10
note = "FULLY GREEN at 10 of 10, recovered from 5 reached. Sorting workspaces exposed two real defects. First, workspace number N compared a STORED number, but sway _workspace_by_number (sway/sway/tree/workspace.c:493-502) walks the digits of the target against the name and requires no further digit, so 1 matches 1:first but not 11; the stored comparison missed 1:first and created a duplicate workspace, after which get_ws returned undef and the file aborted at line 53. Fixed by workspace_name_matches_number, applied on both the activate and the move path. Second, we keep an unnamed trailing placeholder that sway destroys outright (workspace_consider_destroy), so both it and 1:first answered to number 1 and the placeholder won. The placeholder cannot simply be destroyed, since the layout relies on it as a drop target for an interactive move onto an empty workspace, so the resolvers now prefer an explicitly named workspace, which is the one sway would still have."


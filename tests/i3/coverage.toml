[files."176-workspace-baf.t"]
assertions = 26
pass = 26
note = "FULLY GREEN at 26 of 26. Two real defects, both traced to our caching a workspace NAME where sway holds a workspace pointer. First, `rename workspace 1 to 3` was rejected with 'Workspace already exists' because a workspace named 3, left over from the previous section of the file, was still in the layout. Sway would have destroyed it: workspace_consider_destroy (sway/sway/tree/workspace.c:313-330) destroys an empty workspace that is not its output's active one and that no seat's focus-inactive retains, and it runs when focus LEAVES a workspace (seat_set_focus, sway/sway/input/seat.c:1244). The collision check now ignores a workspace sway would already have destroyed, while still honouring the seat-retention clause, which a first attempt omitted and thereby let a genuine collision through. Second, `workspace back_and_forth` went to the OLD name: Monitor caches previous_workspace_name as a string, so a rename left it stale, where sway's pointer is transparent to renames. The rename now refreshes it. A third change was measured and reverted: sweeping every empty workspace after the harness's bulk window removal took 285-sticky from 11 pass to 9, and this file reaches 26 of 26 without it."


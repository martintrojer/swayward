[files."181-regress-float-border.t"]
assertions = 6
pass = 4
citation = "sway/sway/tree/arrange.c:310-315; sway/sway/tree/container.c:1208-1211,1267-1271; sway/sway/commands/border.c:75"
reason = "2 of 6 assertions encode i3's rule that a floating rect survives fullscreen unchanged. Sway overwrites it with the output's geometry while fullscreen and restores the saved floating geometry only on leaving. Measured: our size is preserved and only the position moves, exactly as sway prescribes."
reason_verified = true
skip = [
  { n = 5, reason = "Asserts that a floating container's rect is UNCHANGED after `fullscreen`. That is i3's behaviour, not sway's. Sway sets the fullscreen container's geometry to the output's in arrange_workspace: fs->pending.x = output->lx, fs->pending.y = output->ly, with width and height from the output (sway/sway/tree/arrange.c:310-315). It saves the floating geometry in saved_x/y/width/height (sway/sway/tree/container.c:1208-1211) and restores it only when fullscreen is left (:1267-1271), so while fullscreen the reported rect IS the output's. Measured: our size is preserved exactly at 208x108 and only the position moves from 536,346 to 0,0, which is what arrange.c prescribes." },
  { n = 6, reason = "Asserts that the rect is unchanged after `border pixel 2` while still fullscreen, so it inherits assertion 5's premise: the rect is already the output's, as sway's arrange_workspace requires (sway/sway/tree/arrange.c:310-315). The file also issues i3's `border 1pixel`, which sway does not accept: cmd_border takes `pixel`, not `1pixel` (sway/sway/commands/border.c:75), so rejecting it is correct." },
]

[files."182-regress-focus-dock.t"]
assertions = 1

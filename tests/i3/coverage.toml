reason_verified = true
note = "Fresh measurement reaches `1..1`, but the liveness pass is vacuous: the native window cannot set `_NET_WM_WINDOW_TYPE_DOCK`, so the title criterion addresses an ordinary view instead of a dock. Native behavior is covered by `criteria_do_not_match_layer_surfaces`, which proves a container criterion cannot target a real layer-shell surface. Sway creates layer surfaces outside the view/container criteria path (`sway/sway/desktop/layer_shell.c:409-470`)."


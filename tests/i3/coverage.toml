assertions = 8
pass = 8
note = "Creating and switching to an empty workspace emits sway's `init`, `focus`, and `empty` sequence with full workspace nodes (`sway/tree/workspace.c:268,301`; `sway/sway/ipc-server.c:295-320`)."

[files."116-nestedcons.t"]
plan_unknown = true
assertions = 5
pass = 4
reason = "i3_output_content"
reason_verified = true
note = "The fresh unchanged run has no rejected-command diagnostic. Assertion 1 fails because the expected i3 root schema includes fields that sway omits; the first reported difference is now `window_icon_padding`, correcting the stale note's `scratchpad_state` claim. Assertions 2–5 pass. Workspace discovery then assumes i3's output-level `content` container and aborts before assertions 6–7. Sway's common node serializer defines the root fields without `window_icon_padding`, and sway places workspaces directly below outputs (`sway/sway/ipc-json.c:258-296,854-874`)."
[[files."116-nestedcons.t".skip]]
n = 1
desc = "root node matches i3's full root schema"
reason = "Sway's common node schema omits i3's `window_icon_padding` root field."
citation = "sway/sway/ipc-json.c:258-296"

[files."117-workspace.t"]
assertions = 92
pass = 50
reason = "i3_output_content"
reason_verified = true
note = "The unchanged file passes its first 50 assertions, then dies inside its own workspace_numbers_sorted helper at lines 214-215, which requires i3 output-level content containers. A grep for a quoted content key in sway/sway/ipc-json.c returns zero: sway never emits that node. A direct-workspace diagnostic that bypasses the abort indicated most later assertions would pass and six would fail, but those results are unreachable through the unchanged file, and docs/KNOWN_DEVIATIONS.md forbids synthesizing the node. The remaining assertions are a permanent i3-only tree-structure ceiling."
[[files."117-workspace.t".skip]]
n = 51
desc = "assertion after the workspace_numbers_sorted abort"
reason = "The file dies inside its own workspace_numbers_sorted helper, which looks for a child of type con under each output and then dereferences it. Sway emits no i3 content node, so the value is undefined and the file aborts before every later assertion. The adapter deliberately does not synthesize the node: fabricating it would make an upstream assertion observe a tree that no real sway IPC client receives."
citation = "tests/i3/t/117-workspace.t:206-223; sway/sway/ipc-json.c:854-874; docs/KNOWN_DEVIATIONS.md"

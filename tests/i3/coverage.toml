[files."005-floating.t"]
assertions = 13
pass = 9
citation = "sway/sway/ipc-json.c:606-607; sway/sway/tree/container.c:847-862; sway/sway/desktop/xdg_shell.c:481-482"
skip = [
  { n = 3, reason = "Asserts that the compositor raised a floating window's width to at least 75. On sway this cannot be observed: the adapter reads node->geometry, and sway sets geometry from view->natural_width/height (sway/sway/ipc-json.c:606-607), which is the CLIENT's own size and is never written back by the compositor. Verified on live sway 1.11: a tiled footclient reports geometry 700x491 while its rect is 2552x1412. i3 could assert this because it reconfigures the X11 window, which updates the geometry the test reads. Our compositor does request 75x50, sway's automatic floating minimum (floating_calculate_constraints, sway/sway/tree/container.c:793-810), which was confirmed by probe; the client simply reports its own 1x1. Giving the adapter client a default size would make the assertion pass without testing anything." },
  { n = 4, reason = "Same as assertion 3 for height: node->geometry is the client's own size on sway (sway/sway/ipc-json.c:606-607), not the compositor's, so a raise to the 50px automatic minimum is not observable. Confirmed on live sway 1.11." },
  { n = 9, reason = "Absolute floating POSITION is not expressible under xdg-shell, a standing oracle limit: a client cannot ask to be placed at x=20, so the adapter cannot set up the premise." },
  { n = 10, reason = "Absolute floating POSITION is not expressible under xdg-shell, as for assertion 9." },
]
reason = "4 of 13 assertions cannot be observed on sway. Two read node->geometry, which sway sets from the CLIENT's own natural size and never writes back, so a compositor-applied floating minimum is invisible there; two need absolute floating position, which xdg-shell cannot express. Each skip carries its own citation and measurement."
reason_verified = true

[files."100-fullscreen.t"]
assertions = 79
pass = 76
citation = "sway/sway/tree/container.c:1213-1228"
reason = "3 of 79 assertions cannot be asked through the Wayland adapter: one needs a window held unmapped, which a Wayland client cannot be; one inherits that premise; and one needs `fullscreen => 1` at open_window, which i3test.pm does not implement. Sway's own behaviour matches the third assertion, so it is an adapter gap rather than a compositor defect."
reason_verified = true
skip = [
  { n = 16, reason = "Asserts that a newly mapped X11 window stays UNMAPPED while a fullscreen window is active. A Wayland client is mapped by the compositor as soon as it commits a buffer, and the adapter has no way to keep a surface unmapped while still creating it, so the state the assertion inspects cannot be set up. The i3 original relies on i3 withholding the X11 MapWindow." },
  { n = 33, reason = "Follows `$swindow->fullscreen(0)` on the very window assertion 16 could not leave unmapped, so it inherits that premise: the file comments that it is verifying 'that $swindow was the one that initially remained fullscreen', which never happened here. Reports 1 fullscreen window where 0 was expected." },
  { n = 41, reason = "The adapter does not implement `fullscreen => 1` at open_window: i3test.pm derives only fullscreen_output, and then solely for 531-fullscreen-on-given-output.t, so this window maps as an ordinary one and focus never moves to it. Reports con_id 400000011 where 400000012 was expected. Sway's own behaviour matches the assertion, since container_fullscreen_workspace calls seat_set_focus_container when the container is on the focused workspace (sway/sway/tree/container.c:1213-1228), so this is an adapter gap and not a compositor defect." },
]


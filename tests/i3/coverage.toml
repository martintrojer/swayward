[files."139-ws-numbers.t"]
assertions = 8
pass = 8
note = "FULLY GREEN at 8 of 8. The cause was index-derived identity: sway_display_number and sway_display_name both fell back to the workspace INDEX, so the trailing unnamed placeholder reported a number that changed as other workspaces were inserted, and Monitor::sort_sway_workspaces keyed only on the stored number, which the placeholder lacks, sending it to the end. Inserting workspace 93 therefore placed it ahead of the workspace clients call 1. Fixed by adding Monitor::sway_workspace_number, which reports the lowest number no other workspace owns, and Monitor::sway_workspace_name, which names a placeholder after that number so it cannot collide with a real 1:first; by using that number as the sort key; and by calling sort_sway_workspaces on the creation path in Layout::activate_sway_workspace, since sway sorts on every creation (workspace_create calls output_sort_workspaces, sway/sway/tree/workspace.c:259, with the ordering at sway/sway/tree/output.c:387-405)."


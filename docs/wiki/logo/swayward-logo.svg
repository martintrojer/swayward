<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <title>swayward</title>
  <desc>The sway sapling redrawn as a neon circuit tree on an isometric island.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#170b30"/>
      <stop offset="1" stop-color="#06030e"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#7a2bff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#7a2bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trunk" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fffb0"/>
      <stop offset="1" stop-color="#00b8ff"/>
    </linearGradient>
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="1" stop-color="#5a0f6e"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b2bff"/>
      <stop offset="1" stop-color="#240a4a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2a1655" stroke-width="1"/>
    </pattern>
    <clipPath id="tile"><rect width="800" height="800" rx="168"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b2"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b2"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="800" height="800" fill="url(#bg)"/>
    <rect width="800" height="800" fill="url(#grid)" opacity="0.5"/>
    <circle cx="400" cy="360" r="340" fill="url(#halo)"/>

    <!-- tree and island, centred on the tile -->
    <g transform="translate(15 34)">
      <!-- island: an isometric slab -->
      <g transform="translate(380 540)">
        <polygon points="0,-62 210,0 0,62 -210,0" fill="url(#top)" opacity="0.92"/>
        <polygon points="-210,0 0,62 0,104 -210,42" fill="url(#sideL)"/>
        <polygon points="210,0 0,62 0,104 210,42" fill="url(#sideR)"/>
        <g fill="none" stroke="#e6fffb" stroke-width="2" opacity="0.55">
          <path d="M-150,0 L0,44 L150,0"/>
          <path d="M-90,0 L0,26 L90,0"/>
        </g>
        <polyline points="-210,0 0,-62 210,0 0,62 -210,0" fill="none" stroke="#b8fff0" stroke-width="3" filter="url(#softglow)"/>
        <line x1="0" y1="62" x2="0" y2="104" stroke="#ffb3f2" stroke-width="2"/>
        <!-- drips under the slab: sway's red underside, as neon -->
        <g stroke="#ff2bd6" stroke-width="3" stroke-linecap="round" filter="url(#softglow)">
          <line x1="-120" y1="80" x2="-120" y2="124"/>
          <line x1="-40" y1="100" x2="-40" y2="160"/>
          <line x1="60" y1="96" x2="60" y2="140"/>
          <line x1="140" y1="68" x2="140" y2="104"/>
        </g>
      </g>

      <!-- the sapling as a circuit trace: sway's S-curve trunk, squared off -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M370,500 L370,430 L430,370 L430,300 L400,270 L400,200" stroke="url(#trunk)" stroke-width="16"/>
        <path d="M430,345 L520,255 L520,200" stroke="#00f0ff" stroke-width="10"/>
        <path d="M400,285 L310,195 L310,150" stroke="#00f0ff" stroke-width="10"/>
        <path d="M400,215 L460,155 L520,155" stroke="#7af8ff" stroke-width="8"/>
        <path d="M370,455 L290,375 L240,375" stroke="#ff5be0" stroke-width="8"/>
        <path d="M520,215 L590,145" stroke="#7af8ff" stroke-width="6"/>
        <path d="M310,170 L250,110" stroke="#7af8ff" stroke-width="6"/>
      </g>

      <!-- leaves: container tiles hung on the branches (i3's nested tree) -->
      <g filter="url(#softglow)">
        <g fill="#0b0618" stroke-width="5">
          <rect x="488" y="150" width="64" height="44" rx="4" stroke="#00f0ff"/>
          <rect x="278" y="104" width="64" height="44" rx="4" stroke="#00f0ff"/>
          <rect x="368" y="150" width="64" height="44" rx="4" stroke="#ff2bd6"/>
          <rect x="560" y="100" width="56" height="40" rx="4" stroke="#b98cff"/>
          <rect x="214" y="68" width="56" height="40" rx="4" stroke="#b98cff"/>
          <rect x="206" y="352" width="44" height="44" rx="4" stroke="#ff2bd6"/>
        </g>
        <g stroke-width="3" fill="none">
          <line x1="520" y1="150" x2="520" y2="194" stroke="#00f0ff"/>
          <line x1="278" y1="126" x2="342" y2="126" stroke="#00f0ff"/>
          <line x1="390" y1="150" x2="390" y2="194" stroke="#ff2bd6"/>
          <line x1="410" y1="150" x2="410" y2="194" stroke="#ff2bd6"/>
          <line x1="560" y1="114" x2="616" y2="114" stroke="#b98cff"/>
          <line x1="242" y1="68" x2="242" y2="108" stroke="#b98cff"/>
        </g>
      </g>

      <!-- solder pads at the joints -->
      <g fill="#0b0618" stroke-width="5" filter="url(#softglow)">
        <circle cx="430" cy="345" r="10" stroke="#00f0ff"/>
        <circle cx="400" cy="285" r="10" stroke="#00f0ff"/>
        <circle cx="400" cy="215" r="9" stroke="#7af8ff"/>
        <circle cx="370" cy="455" r="10" stroke="#ff5be0"/>
        <circle cx="370" cy="500" r="12" stroke="#ff2bd6"/>
      </g>
    </g>
  </g>
</svg>

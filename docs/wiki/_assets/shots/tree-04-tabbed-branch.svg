<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title">
<title id="title">A tabbed container whose visible tab is the vertical B and C column</title>
<rect width="640" height="400" rx="16" fill="#111318"/>
<rect x="35" y="25" width="570" height="350" rx="10" fill="none" stroke="#89b4fa" stroke-width="3"/>
<text x="51" y="55" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">tabbed</text><rect x="60" y="65" width="150" height="45" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="135.0" y="94.16666666666667" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="20">A</text><rect x="210" y="65" width="370" height="45" rx="10" fill="#1e1e2e" stroke="#ffc87f" stroke-width="5"/>
<text x="395.0" y="94.16666666666667" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="20">splitv [ B, C ]</text><rect x="60" y="120" width="520" height="225" rx="10" fill="none" stroke="#a6e3a1" stroke-width="3"/>
<text x="76" y="150" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="20">visible splitv tab</text><rect x="80" y="150" width="480" height="75" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="320.0" y="197.5" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="30">B</text><rect x="80" y="245" width="480" height="75" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="320.0" y="292.5" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="30">C</text>
</svg>

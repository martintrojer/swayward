<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title">
<title id="title">A workspace containing a tiled tree and a separate floating stage</title>
<rect width="640" height="400" rx="16" fill="#111318"/>
<rect x="25" y="25" width="590" height="350" rx="10" fill="none" stroke="#89b4fa" stroke-width="3"/>
<text x="41" y="55" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">workspace</text><rect x="50" y="80" width="300" height="260" rx="10" fill="none" stroke="#6c7086" stroke-width="3"/>
<text x="66" y="110" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">tiled tree</text><rect x="75" y="125" width="250" height="180" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="200.0" y="228.33333333333334" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="40">A</text><rect x="380" y="80" width="210" height="260" rx="10" fill="none" stroke="#ffc87f" stroke-width="3"/>
<text x="396" y="110" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">floating stage</text><rect x="405" y="125" width="160" height="180" rx="10" fill="#313244" stroke="#ffc87f" stroke-width="7"/>
<text x="485.0" y="228.33333333333334" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="40">B</text>
</svg>

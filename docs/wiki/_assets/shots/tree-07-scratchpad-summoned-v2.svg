<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title">
<title id="title">Window B summoned onto workspace 2's floating stage beside a tiled C and D column</title>
<rect width="640" height="400" rx="16" fill="#111318"/>
<rect x="25" y="25" width="590" height="350" rx="10" fill="none" stroke="#89b4fa" stroke-width="3"/>
<text x="41" y="55" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">workspace 2</text><rect x="50" y="80" width="300" height="260" rx="10" fill="none" stroke="#6c7086" stroke-width="3"/>
<text x="66" y="110" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">splitv</text><rect x="75" y="125" width="250" height="85" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="200.0" y="177.5" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="30">C</text><rect x="75" y="230" width="250" height="85" rx="10" fill="#1e1e2e" stroke="#6c7086" stroke-width="3"/>
<text x="200.0" y="282.5" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="30">D</text><rect x="380" y="80" width="210" height="260" rx="10" fill="none" stroke="#ffc87f" stroke-width="3"/>
<text x="396" y="110" text-anchor="start" fill="#cdd6f4" font-family="monospace" font-size="22">floating stage</text><rect x="405" y="125" width="160" height="180" rx="10" fill="#313244" stroke="#ffc87f" stroke-width="7"/>
<text x="485.0" y="209.0" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="24"><tspan x="485.0" dy="0">B</tspan><tspan x="485.0" dy="28">summoned</tspan></text>
</svg>

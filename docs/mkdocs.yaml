site_name: swayward
site_url: https://martintrojer.github.io/swayward
repo_url: https://github.com/martintrojer/swayward
edit_uri: edit/main/docs/wiki/
docs_dir: wiki
use_directory_urls: false

theme:
  name: material
  logo: _assets/icons/logo.svg
  favicon: _assets/icons/logo.svg
  features:
    - navigation.instant
    - search.suggest
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      primary: custom
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: custom
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
markdown_extensions:
  - github-callouts
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.keys
  - toc:
      permalink: '#'
plugins:
  - search
hooks:
  - hooks/shortcodes.py
  - hooks/remove-must-fail.py
extra_css:
  - _assets/stylesheets/swayward.css
strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
not_in_nav: |
  _Sidebar.md
  README.md
nav:
  - Home: Home.md
  - Getting started: Getting-Started.md
  - FAQ: FAQ.md
  - Coming from sway or i3:
    - Migrate a sway config: https://github.com/martintrojer/swayward/wiki/SWAY_CONFIG_MIGRATION
    - Sway compatibility: Sway-Compatibility.md
    - Differences from sway: Differences-from-Sway.md
    - Testing and conformance: Testing-and-Conformance.md
  - Learn the tree:
    - Why care about window management?: Why-Window-Management.md
    - Cult of the Tree:
      - Introduction: Sway-School.md
      - I. Windows and focus: Tree-School:-Windows-and-Focus.md
      - II. Splits become a tree: Tree-School:-Splits-and-Containers.md

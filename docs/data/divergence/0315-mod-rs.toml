what = "bound tiling-tree nesting at 64 levels below the workspace: split, layout and consume stop wrapping, a directional move stops wrapping the root, and swaps, container moves and cross-workspace attaches refuse or fall back to the workspace root when a subtree would land deeper."
why = "Sway has no depth limit (container_split, sway/tree/container.c:1508-1560). swayward's geometry, GET_TREE and transfer walks recurse once per level on the compositor thread, and a scripted `splitt; focus parent; splitt` loop overflowed the stack a few thousand levels down, aborting the session. A deliberate divergence: only trees deeper than 64 levels, far beyond any hand-built layout, behave differently."


what = "propagate whether floating and tiled width/height resize commands changed the effective target size, return sway's CMD_INVALID-shaped refusal when min/max constraints, a missing parallel boundary, or an ancestor-only change leaves that target unchanged, preserve sway's no-target resize error when the workspace itself is focused, and parse bare numeric rename sources as names, ignore inactive empty rename sources that sway has destroyed, and classify rename-workspace failures as CMD_INVALID."
why = "Sway rejects no-op resize adjustments with `Cannot resize any further` after clamping floating deltas and comparing the target container's fractions (`sway/commands/resize.c:180-280`), rejects resize with `Cannot resize nothing` when the command target is a workspace (`sway/commands/resize.c:559-576`), and returns CMD_INVALID for invalid rename requests (`sway/commands/rename.c:22-92`); swayward previously compared floating tile sizes before pending requests were applied, discarded width and height layout results, credited ancestor-only changes to the target, treated the focused workspace's root split as a container target, and omitted `parse_error` from rename failures."


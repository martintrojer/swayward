paths = ["src/ipc/server.rs", "src/tests/ipc/events.rs"]
what = "serialize a workspace init event as the empty workspace at creation time instead of replacing it with the command's settled destination tree."
why = "Sway emits workspace init from `workspace_create` before a following container move populates the workspace (`sway/tree/workspace.c`; `sway/sway/ipc-server.c`). The transaction flusher's settled-tree substitution leaked the moved floating group into the earlier init event."


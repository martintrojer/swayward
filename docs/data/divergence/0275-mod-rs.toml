what = "include resident floating-tree leaves in command criteria matching without changing window event iteration."
why = "Sway evaluates criteria against every view, including views nested below a floating split (`sway/criteria.c`; `sway/commands/focus.c`). Swayward's general window iterator omits resident-tree leaves to preserve event semantics, so criteria need to read those leaves from the recursive IPC tree separately."


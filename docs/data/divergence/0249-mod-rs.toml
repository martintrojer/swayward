paths = ["src/input/mod.rs", "src/layout/mod.rs", "src/layout/monitor.rs", "src/layout/workspace.rs", "swayward-config/src/input.rs", "swayward-config/src/lib.rs", "resources/default-config.kdl", "docs/wiki/Configuration:-Input.md"]
what = "add `input { gap-resize }`, off by default: a plain left press in the gap between two tiled windows starts the border drag's interactive resize on the shared edge, with the same hover cursor; outer gaps, floating windows and gap corners are not handles."
why = "Sway's only no-modifier resize handle is a visible border, so a borderless setup that marks focus with niri's focus ring could not drag-resize at all. The gap is where that ring is drawn. Sway has no equivalent, so the option is off by default and recorded in docs/KNOWN_DEVIATIONS.md."


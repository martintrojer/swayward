what = "preserve non-empty singleton split containers when a child window closes, moves to the scratchpad, or is vacated by an outward directional move; only reap containers made empty by the removal, and resolve a one-window directional move's source parent after root compaction."
why = "Sway's container detach path calls `container_reap_empty`, which removes empty ancestors but retains a split with one surviving child (`sway/tree/container.c`). Swayward instead collapsed every singleton ancestor and changed the IPC tree shape; after retaining it, the one-window move path could keep a stale pre-compaction parent ID and leave its actual parent empty."


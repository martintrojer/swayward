why = "Sway evaluates criteria against every view and emits `window::focus` after focusing a matched view (`sway/criteria.c`; `sway/input/seat.c:1177-1198`). Swayward's general event iterator omits resident-tree leaves, so criteria matching and the resulting event need the recursive tree path."

